<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050907">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cocodrilo">
<link rel="manifest" href="./manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<title>Radar Cocodrilo Pro v10.8 — Live Total + Agente IA</title>
<style>
:root{
  --bg:#040806;
  --bg2:#08100c;
  --surface:rgba(12,21,16,.80);
  --surface-2:rgba(17,30,23,.94);
  --surface-solid:#0b130f;
  --glass-strong:rgba(5,10,8,.90);
  --line:rgba(155,212,175,.10);
  --line2:rgba(155,212,175,.20);
  --line-bright:rgba(110,231,183,.42);
  --text:#f4fbf6;
  --text2:#c9dfd0;
  --muted:#7f9b8a;
  --emerald:#4ade80;
  --emerald-2:#22c55e;
  --emeraldBg:rgba(34,197,94,.14);
  --gold:#f6d074;
  --goldBg:rgba(246,208,116,.14);
  --red:#fb7185;
  --redBg:rgba(251,113,133,.14);
  --blue:#60a5fa;
  --blueBg:rgba(96,165,250,.14);
  --violet:#c084fc;
  --violetBg:rgba(192,132,252,.14);
  --nav-h:76px;
  --radius-xl:24px;
  --radius-lg:18px;
  --radius-md:13px;
  --shadow-card:0 14px 36px rgba(0,0,0,.44), inset 0 1px 0 rgba(255,255,255,.06);
  --shadow-soft:0 8px 22px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overscroll-behavior-y:contain;background:var(--bg)}
body{
  background:
    radial-gradient(680px 420px at 4% -4%,rgba(34,197,94,.19),transparent 62%),
    radial-gradient(560px 380px at 96% 2%,rgba(246,208,116,.11),transparent 60%),
    radial-gradient(520px 360px at 50% 100%,rgba(16,185,129,.08),transparent 68%),
    var(--bg);
  color:var(--text);
  font:14.5px/1.46 "Plus Jakarta Sans","Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  padding-top:calc(62px + env(safe-area-inset-top));
  padding-bottom:calc(var(--nav-h) + 34px + env(safe-area-inset-bottom));
}
code,.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
a{color:var(--emerald);text-decoration:none}

/* TOP APP BAR — ZERO OVERLAP EVEN AT 320px */
.appbar{
  position:fixed;top:0;left:0;right:0;z-index:35;
  padding:env(safe-area-inset-top) 12px 0;
  height:calc(62px + env(safe-area-inset-top));
  background:var(--glass-strong);
  backdrop-filter:blur(26px) saturate(150%);
  -webkit-backdrop-filter:blur(26px) saturate(150%);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
}
.appbar-inner{
  width:100%;max-width:980px;height:62px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.brand{
  display:flex;align-items:center;gap:9px;
  flex:1;min-width:0;overflow:hidden;
}
.logo{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex-shrink:0;
  background:linear-gradient(145deg,#6ee7b7 0%,#16a34a 58%,#14532d 100%);
  box-shadow:0 6px 20px rgba(34,197,94,.34),inset 0 1px 1px rgba(255,255,255,.45);
}
.brand-txt{min-width:0;overflow:hidden}
.brand h1{
  margin:0;font-size:14.5px;letter-spacing:.04em;font-weight:800;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15;
}
.brand small{
  display:flex;align-items:center;gap:5px;margin-top:2px;
  font-size:9.5px;letter-spacing:.07em;color:var(--muted);text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.ver-tag{
  font-family:"JetBrains Mono",ui-monospace,monospace;
  font-size:9px;font-weight:700;padding:1px 5px;border-radius:5px;letter-spacing:.02em;
  background:rgba(74,222,128,.16);color:#86efac;border:1px solid rgba(74,222,128,.3);
  text-transform:none;flex-shrink:0;
}
.appbar-right{display:flex;align-items:center;gap:5px;flex-shrink:0}
.live-pill{
  display:inline-flex;align-items:center;gap:5px;padding:6px 9px;border-radius:99px;
  font-size:10.5px;font-weight:800;background:var(--emeraldBg);color:var(--emerald);
  border:1px solid rgba(74,222,128,.32);white-space:nowrap;
}
.live-pill.demo{background:var(--goldBg);color:var(--gold);border-color:rgba(246,208,116,.36)}
.cloud-pill{
  display:inline-flex;align-items:center;gap:4px;padding:6px 8px;border-radius:99px;
  font-size:10.5px;font-weight:800;background:rgba(255,255,255,.04);color:var(--muted);
  border:1px solid var(--line2);cursor:pointer;white-space:nowrap;transition:all .16s;
}
.cloud-pill:active{transform:scale(.95)}
.cloud-pill.ok{background:var(--blueBg);color:#93c5fd;border-color:rgba(96,165,250,.35)}
.cloud-pill.saving{background:var(--goldBg);color:var(--gold);border-color:rgba(246,208,116,.4)}
.cloud-pill.err{background:var(--redBg);color:var(--red);border-color:rgba(251,113,133,.4)}
.dot{width:6.5px;height:6.5px;border-radius:50%;background:currentColor;box-shadow:0 0 9px currentColor;animation:pulse 2s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.82)}}
.icon-btn{
  width:36px;height:36px;border-radius:11px;border:1px solid var(--line2);
  background:rgba(255,255,255,.04);color:var(--text);display:grid;place-items:center;
  cursor:pointer;font-size:15px;transition:all .16s;flex-shrink:0;
}
.icon-btn:active{transform:scale(.92);background:rgba(255,255,255,.1)}
.icon-btn.spinning{animation:spin .75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:375px){
  .logo{width:34px;height:34px;font-size:17px;border-radius:10px}
  .brand h1{font-size:13.5px}
  .live-pill,.cloud-pill{padding:5px 7px;font-size:10px}
  .icon-btn{width:33px;height:33px}
}

/* LAYOUT */
.main{max-width:980px;margin:0 auto;padding:12px 13px 12px}
.view{display:none;animation:fadeUp .22s cubic-bezier(.16,1,.3,1)}
.view.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* MARKET BAR — SLEEK TICKER */
.mkt-bar{
  display:none;margin-bottom:10px;padding:10px 13px;border-radius:17px;
  background:var(--surface);border:1px solid var(--line);
  flex-direction:column;gap:8px;font-size:12px;
  backdrop-filter:blur(14px);box-shadow:var(--shadow-soft);
}
.mkt-bar.show{display:flex}
.mkt-bar.PANICO{border-color:rgba(74,222,128,.42);background:linear-gradient(135deg,rgba(18,52,32,.78),rgba(9,16,12,.9))}
.mkt-bar.CAUTELA{border-color:rgba(246,208,116,.3);background:linear-gradient(135deg,rgba(36,28,12,.58),rgba(10,17,13,.9))}
.mkt-bar.EUFORIA{border-color:rgba(251,113,133,.32);background:linear-gradient(135deg,rgba(44,18,24,.58),rgba(10,17,13,.9))}
.mkt-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.mkt-title{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:12px;letter-spacing:.02em}
.mkt-sub{color:var(--muted);font-size:11.5px;flex:1;min-width:140px}
.mkt-pills{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%}
.mkt-chip{
  padding:5px 8px;border-radius:10px;background:rgba(255,255,255,.045);
  border:1px solid var(--line);font-weight:750;font-size:11px;font-variant-numeric:tabular-nums;
  text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-family:"JetBrains Mono",ui-monospace,monospace;color:var(--text2);
}

/* UNIFIED CONTROL CARD (SWITCH + ACTIONS) */
.control-card{
  background:var(--surface);border:1px solid var(--line);border-radius:20px;
  padding:10px;margin-bottom:12px;box-shadow:var(--shadow-soft);backdrop-filter:blur(14px);
}
.source-switch{
  display:grid;grid-template-columns:1fr 1fr;gap:6px;background:rgba(4,9,7,.85);
  border:1px solid var(--line);border-radius:15px;padding:4px;margin-bottom:10px;
}
.src-btn{
  border:0;background:transparent;color:var(--muted);border-radius:11px;padding:9px 8px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:all .18s;
  min-width:0;
}
.src-btn strong{
  font-size:12px;font-weight:800;color:inherit;
  display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;
}
.src-btn small{font-size:10px;opacity:.8;font-variant-numeric:tabular-nums;white-space:nowrap}
.src-btn.active{
  background:linear-gradient(135deg,rgba(74,222,128,.22),rgba(16,185,129,.09));
  color:var(--emerald);box-shadow:inset 0 0 0 1px rgba(74,222,128,.45),0 4px 14px rgba(34,197,94,.14);
}
.src-btn.missing{opacity:.5}
.src-ver{
  font-family:"JetBrains Mono",ui-monospace,monospace;
  font-size:9px;padding:1.5px 5px;border-radius:5px;background:rgba(255,255,255,.07);
  color:var(--text2);font-weight:700;
}
.src-btn.active .src-ver{background:rgba(74,222,128,.22);color:#bbf7d0}

.run-bar{padding:2px 2px 0}
.run-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;padding:0 2px;font-size:11px;color:var(--muted)}
.run-status{display:inline-flex;align-items:center;gap:6px;min-width:0}
.run-status span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.run-dot{width:7px;height:7px;border-radius:50%;background:#64748b;flex-shrink:0}
.run-dot.ok{background:var(--emerald);box-shadow:0 0 8px rgba(74,222,128,.55)}
.run-dot.running{background:var(--gold);box-shadow:0 0 10px var(--gold);animation:pulse 1.2s infinite}
.run-dot.fail{background:var(--red)}
.run-btns{display:grid;grid-template-columns:1fr 1fr auto;gap:6px}
.run-btn{
  border:1px solid var(--line2);background:rgba(255,255,255,.045);color:var(--text);
  border-radius:12px;height:38px;padding:0 11px;font-size:12px;font-weight:800;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:all .16s;
  white-space:nowrap;
}
.run-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.run-btn:active{transform:scale(.96)}
.run-btn:disabled{opacity:.48;cursor:not-allowed}
.run-btn.go{background:linear-gradient(135deg,rgba(34,197,94,.22),rgba(22,163,74,.1));border-color:rgba(74,222,128,.4);color:#bbf7d0}
.run-btn.mega{background:linear-gradient(135deg,rgba(246,208,116,.2),rgba(217,164,65,.08));border-color:rgba(246,208,116,.4);color:#fef08a}
.custom-scan-box{display:none;margin-top:9px;padding-top:9px;border-top:1px solid var(--line);gap:7px;align-items:center}
.custom-scan-box.show{display:flex}
.custom-scan-box input{
  flex:1;height:38px;border-radius:11px;border:1px solid var(--line2);background:#050b08;
  color:var(--text);padding:0 12px;font:inherit;font-size:12.5px;outline:none;
}
.custom-scan-box input:focus{border-color:var(--emerald);box-shadow:0 0 0 3px rgba(74,222,128,.12)}

/* BUTTONS */
.btn{
  border:1px solid var(--line2);background:rgba(255,255,255,.05);color:var(--text);
  padding:10px 14px;border-radius:13px;font-weight:750;font-size:13px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:all .16s;min-height:42px;
}
.btn:active{transform:scale(.97)}
.btn.primary{
  background:linear-gradient(135deg,#4ade80 0%,#16a34a 100%);
  color:#03170a;border-color:transparent;font-weight:800;
  box-shadow:0 8px 22px rgba(34,197,94,.28),inset 0 1px 0 rgba(255,255,255,.35);
}
.btn.gold{
  background:linear-gradient(135deg,#f8db8c 0%,#d9a441 100%);
  color:#1c1303;border-color:transparent;font-weight:800;
  box-shadow:0 6px 18px rgba(246,208,116,.24),inset 0 1px 0 rgba(255,255,255,.4);
}
.btn.danger{background:var(--redBg);color:#fecdd3;border-color:rgba(251,113,133,.36)}
.btn.sm{padding:8px 12px;font-size:12px;border-radius:11px;min-height:36px}
.btn.full{width:100%}

/* HERO CARD — ALIGNED BASELINE KPIS & EXECUTIVE DEPTH */
.hero-card{
  background:
    radial-gradient(360px 200px at 94% -12%,rgba(74,222,128,.24),transparent 70%),
    linear-gradient(155deg,rgba(18,36,25,.94),rgba(8,15,11,.97));
  border:1px solid rgba(74,222,128,.3);border-radius:var(--radius-xl);
  padding:17px;margin-bottom:13px;position:relative;overflow:hidden;
  box-shadow:var(--shadow-card);
}
.hero-card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(110,231,183,.65),transparent);
}
.hero-card.urgent-hero{
  border-color:rgba(251,113,133,.58);
  background:
    radial-gradient(340px 190px at 92% -10%,rgba(251,113,133,.3),transparent 70%),
    linear-gradient(155deg,rgba(56,16,24,.92),rgba(12,15,13,.97));
}
.hero-card.urgent-hero::before{
  background:linear-gradient(90deg,transparent,rgba(251,113,133,.85),rgba(246,208,116,.65),transparent);
}
.hero-top-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:nowrap}
.eyebrow{
  font-size:10px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--emerald);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.urgent-hero .eyebrow{color:#fda4af}
.ai-mini{
  font-size:10px;font-weight:800;padding:3px 9px;border-radius:99px;
  background:rgba(96,165,250,.15);color:#93c5fd;border:1px solid rgba(96,165,250,.32);
  white-space:nowrap;flex-shrink:0;
}
.ai-mini.warn{background:var(--goldBg);color:var(--gold);border-color:rgba(246,208,116,.36)}
.hero-title{
  font-size:21px;line-height:1.18;margin:9px 0 5px;font-weight:800;letter-spacing:-.025em;
  cursor:pointer;
}
.hero-sub{margin:0;color:#b8cebe;font-size:12.5px;line-height:1.42}
.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.kpi{
  background:rgba(4,9,7,.72);border:1px solid var(--line);border-radius:15px;
  padding:10px 11px;cursor:pointer;transition:all .16s;
  display:flex;flex-direction:column;justify-content:space-between;min-width:0;
  position:relative;overflow:hidden;
}
.kpi::after{content:"";position:absolute;top:0;left:12px;right:12px;height:2px;border-radius:0 0 4px 4px;background:rgba(148,163,184,.28)}
.kpi.g::after{background:linear-gradient(90deg,transparent,var(--emerald),transparent)}
.kpi.y::after{background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.kpi:active{transform:scale(.97);border-color:var(--line2)}
.kpi span{
  display:flex;align-items:center;gap:5px;
  font-size:10.5px;color:var(--muted);font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.kdot{width:6px;height:6px;border-radius:50%;flex-shrink:0;background:#94a3b8}
.kdot.g{background:var(--emerald);box-shadow:0 0 8px var(--emerald)}
.kdot.y{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.kdot.b{background:var(--blue);box-shadow:0 0 8px var(--blue)}
.kpi strong{
  display:block;font-size:22px;font-weight:800;margin-top:5px;
  font-variant-numeric:tabular-nums;letter-spacing:-.025em;line-height:1;
}
.kpi.g strong{color:var(--emerald)}
.kpi.y strong{color:var(--gold)}

.demo-bar{
  display:none;margin-bottom:11px;padding:11px 14px;border-radius:16px;
  background:linear-gradient(135deg,rgba(246,208,116,.16),rgba(246,208,116,.05));
  border:1px solid rgba(246,208,116,.36);color:#f9e4b2;font-size:12px;
  align-items:center;justify-content:space-between;gap:10px;
}
.demo-bar.show{display:flex}

/* CHIPS & SEARCH */
.chips-scroll{display:flex;gap:7px;overflow-x:auto;padding:2px 0 9px;margin-bottom:7px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips-scroll::-webkit-scrollbar{display:none}
.fchip{
  white-space:nowrap;border:1px solid var(--line2);background:rgba(255,255,255,.035);color:var(--muted);
  padding:8px 13px;border-radius:99px;font-size:12px;font-weight:750;cursor:pointer;transition:all .16s;
}
.fchip.active{
  background:linear-gradient(135deg,rgba(74,222,128,.22),rgba(34,197,94,.1));
  color:#bbf7d0;border-color:rgba(74,222,128,.48);box-shadow:0 4px 12px rgba(34,197,94,.16);
}
.search-row{display:flex;gap:8px;margin-bottom:14px}
.search-box{flex:1;position:relative;min-width:0}
.search-box input{
  width:100%;height:44px;padding:0 13px 0 38px;border-radius:14px;border:1px solid var(--line2);
  background:rgba(9,16,12,.92);color:var(--text);font:inherit;font-size:13.5px;outline:none;transition:all .16s;
}
.search-box input:focus{border-color:var(--emerald);box-shadow:0 0 0 3px rgba(74,222,128,.13)}
.search-box span{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.65;display:grid;place-items:center;color:var(--muted)}
.sort-sel{
  height:44px;border-radius:14px;border:1px solid var(--line2);background:rgba(9,16,12,.92);
  color:var(--text);padding:0 10px;font:inherit;font-size:12.5px;font-weight:700;max-width:146px;outline:none;
}

/* STOCK CARDS */
.cards-grid{display:grid;grid-template-columns:1fr;gap:13px}
@media(min-width:740px){.cards-grid{grid-template-columns:1fr 1fr}}
.stock-card{
  background:linear-gradient(168deg,rgba(16,28,21,.95),rgba(8,14,10,.98));
  border:1px solid var(--line);border-radius:22px;padding:16px;
  display:flex;flex-direction:column;gap:11px;position:relative;overflow:hidden;
  box-shadow:var(--shadow-card);transition:transform .16s,border-color .16s;
}
.stock-card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);
}
.stock-card.opp{border-color:rgba(74,222,128,.4);box-shadow:0 12px 32px rgba(34,197,94,.11)}
.stock-card.opp::after{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#4ade80,#f6d074,#4ade80)}
.stock-card.ganga{border-color:rgba(246,208,116,.62);box-shadow:0 14px 36px rgba(246,208,116,.15)}
.stock-card.ganga::after{content:"";position:absolute;top:0;left:0;right:0;height:3.5px;background:linear-gradient(90deg,#f8db8c,#4ade80,#f8db8c)}
.stock-card.entrar-ya{border-color:rgba(251,113,133,.75);box-shadow:0 14px 38px rgba(251,113,133,.2)}
.stock-card.entrar-ya::after{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#fb7185,#f6d074,#4ade80)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card-id{min-width:0;flex:1}
.card-name{font-size:16.5px;font-weight:800;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-meta{font-size:11.5px;color:var(--muted);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tkr{
  background:rgba(255,255,255,.07);border:1px solid var(--line2);color:var(--text);
  padding:2px 7px;border-radius:7px;font-weight:700;font-size:11px;letter-spacing:.04em;
  font-family:"JetBrains Mono",ui-monospace,monospace;
}
.right-tools{display:flex;align-items:center;gap:7px;flex-shrink:0}
.star-btn{
  width:36px;height:36px;border-radius:11px;border:1px solid var(--line);
  background:rgba(255,255,255,.03);color:var(--muted);font-size:16px;display:grid;place-items:center;cursor:pointer;transition:all .15s;
}
.star-btn:active{transform:scale(.9)}
