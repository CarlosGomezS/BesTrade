name: 🐊 Escáner Diario Cocodrilo (~200 Élite Mundial)

on:
  schedule:
    # Lunes a Viernes a las 21:30 UTC (cierre Europa y EE. UU.)
    - cron: '30 21 * * 1-5'
  workflow_dispatch:
    inputs:
      universe:
        description: 'Cuántas empresas analizar'
        required: true
        default: 'elite200'
        type: choice
        options:
          - 'elite200'
          - 'sp500'
          - 'global_1000'
      test_mode:
        description: 'Enviar Telegram aunque hoy no haya oportunidades (Modo prueba)'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      custom_tickers:
        description: 'Tickers extra opcionales separados por coma (ej. IBE.MC, ASML.AS)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install --no-cache-dir -r requirements.txt

      - name: Ejecutar Escáner Cocodrilo y avisar a Telegram
        env:
          UNIVERSE_MODE: ${{ github.event.inputs.universe || 'elite200' }}
          TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
          CUSTOM_TICKERS: ${{ github.event.inputs.custom_tickers || '' }}
          MAX_WORKERS: '3'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scanner/buffett_scanner.py

      - name: Actualizar panel visual automáticamente
        run: |
          git config user.name "Cocodrilo Bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/latest-scan.json
          git diff --staged --quiet || git commit -m "Actualización diaria Radar Cocodrilo"
          git push
