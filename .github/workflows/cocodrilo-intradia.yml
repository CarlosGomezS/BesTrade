name: Radar Cocodrilo Vigilante Intradía (ENTRAR YA)

on:
  schedule:
    # Lunes a Viernes durante sesiones de Europa y EE. UU. (horas UTC)
    - cron: '35 9,11,13,15,16,17,18,19,20 * * 1-5'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Enviar push/Telegram de prueba aunque no haya novedades ENTRAR YA (true/false)'
        required: false
        default: 'true'

permissions:
  contents: write

concurrency:
  group: cocodrilo-intradia
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install --upgrade yfinance pandas google-auth requests

      - name: Vigilar oportunidades ENTRAR YA y enviar Push Firebase
        env:
          UNIVERSE_MODE: rotacion_diaria
          URGENT_ONLY: 'true'
          URGENT_DOUBLE_PING: 'false'
          ALERT_COOLDOWN_DAYS: '7'
          ALERT_RETRIGGER_DROP_PCT: '5'
          TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DEVICE_TOKEN: ${{ secrets.FIREBASE_DEVICE_TOKEN }}
        run: python scanner/buffett_scanner.py

      - name: Guardar registro anti-spam (alert-cooldown.json)
        run: |
          if [ -f data/alert-cooldown.json ]; then
            cp data/alert-cooldown.json /tmp/alert-cooldown.json
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data
            cp /tmp/alert-cooldown.json data/alert-cooldown.json
            git add data/alert-cooldown.json
            if ! git diff --cached --quiet; then
              git commit -m "Update alert cooldown anti-spam"
              git push
            else
              echo "Sin cambios en alert-cooldown.json"
            fi
          fi
