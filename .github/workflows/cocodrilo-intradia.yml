name: Radar Cocodrilo Vigilante Intradía (ENTRAR YA)

on:
  schedule:
    # Lunes a Viernes durante sesiones de Europa y EE. UU. (horas UTC)
    - cron: '35 9,11,13,15,16,17,18,19,20 * * 1-5'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Enviar push/Telegram de prueba aunque no haya ENTRAR YA (true/false)'
        required: false
        default: 'true'

permissions:
  contents: read

concurrency:
  group: cocodrilo-intradia
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install --upgrade yfinance pandas google-auth requests

      - name: Vigilar oportunidades ENTRAR YA y enviar Push Firebase
        env:
          UNIVERSE_MODE: rotacion_diaria
          URGENT_ONLY: 'true'
          URGENT_DOUBLE_PING: 'false'
          TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DEVICE_TOKEN: ${{ secrets.FIREBASE_DEVICE_TOKEN }}
        run: python scanner/buffett_scanner.py
