name: Radar Cocodrilo Semanal Mega +2000

on:
  schedule:
    - cron: '0 8 * * 6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cocodrilo-scan
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install --upgrade yfinance pandas

      - name: Ejecutar tests del Oráculo (obligatorio)
        run: python -m unittest scanner/test_oracle_v10.py -v

  scan:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install --upgrade yfinance pandas

      - name: Escanear bloque ${{ matrix.shard }}
        env:
          UNIVERSE_MODE: global_mega
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: 6
          MAX_WORKERS: 3
        run: python scanner/buffett_scanner.py

      - name: Subir shard ${{ matrix.shard }}
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: data/shards/shard-${{ matrix.shard }}.json
          retention-days: 1

  merge:
    needs: [test, scan]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install --upgrade yfinance pandas

      - name: Descargar los 6 shards
        uses: actions/download-artifact@v4
        with:
          path: /tmp/cocodrilo_shards

      - name: Fusionar, auditar y avisar por Telegram
        env:
          UNIVERSE_MODE: global_mega
          MERGE_DIR: /tmp/cocodrilo_shards
          SHARD_TOTAL: 6
          TEST_MODE: 'true'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scanner/buffett_scanner.py

      - name: Publicar JSON semanal
        run: |
          mkdir -p /tmp/cocodrilo_out
          cp data/*.json /tmp/cocodrilo_out/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p data
          cp /tmp/cocodrilo_out/*.json data/ 2>/dev/null || true
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Update Radar Cocodrilo weekly scan"
            git push
          else
            echo "Sin cambios en data/"
          fi
