name: Mega Escaner Semanal 2000

on:
  schedule:
    - cron: "0 9 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cocodrilo-scan
  cancel-in-progress: false

jobs:
  scan-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install --no-cache-dir -r requirements.txt

      - name: Escanear bloque paralelo ${{ matrix.shard }}
        env:
          UNIVERSE_MODE: "global_mega"
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: "6"
          MAX_WORKERS: "3"
        run: python scanner/buffett_scanner.py

      - name: Guardar bloque temporal
        uses: actions/upload-artifact@v4
        with:
          name: cocodrilo-shard-${{ matrix.shard }}
          path: data/shards/shard-${{ matrix.shard }}.json
          retention-days: 1

  merge-and-publish:
    needs: scan-shard
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install --no-cache-dir -r requirements.txt

      - name: Descargar todos los bloques
        uses: actions/download-artifact@v4
        with:
          pattern: cocodrilo-shard-*
          path: data/shards
          merge-multiple: true

      - name: Fusionar + Filtro Gemini 3 + Avisar a Telegram
        env:
          UNIVERSE_MODE: "global_mega"
          MERGE_DIR: "data/shards"
          TEST_MODE: "true"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scanner/buffett_scanner.py

      - name: Publicar resultados en el panel visual
        run: |
          mkdir -p /tmp/cocodrilo_out
          for f in data/latest-scan.json data/weekly-scan.json; do
            if [ -f "$f" ]; then cp "$f" /tmp/cocodrilo_out/; fi
          done
          git fetch origin main
          git reset --hard origin/main
          mkdir -p data
          cp /tmp/cocodrilo_out/*.json data/
          git config user.name "Cocodrilo Bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Mega-escaneo semanal global +2000 empresas"
          git push

      - name: Avisar a Telegram si falla el bot
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=ERROR en Mega Escaner Semanal (${{ github.workflow }}). Revisa el fallo aqui: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
