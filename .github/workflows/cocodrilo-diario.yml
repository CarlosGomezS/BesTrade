name: Escaner Diario Cocodrilo

on:
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
    inputs:
      universe:
        description: "Universo a analizar"
        required: true
        default: "elite200"
        type: choice
        options:
          - "elite200"
          - "sp500"
          - "global_1000"
      test_mode:
        description: "Enviar Telegram aunque no haya oportunidades"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      custom_tickers:
        description: "Tickers extra separados por coma"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: cocodrilo-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install --no-cache-dir -r requirements.txt

      - name: Ejecutar Escaner Cocodrilo y avisar a Telegram
        env:
          UNIVERSE_MODE: ${{ github.event.inputs.universe || 'elite200' }}
          TEST_MODE: ${{ github.event.inputs.test_mode || 'true' }}
          CUSTOM_TICKERS: ${{ github.event.inputs.custom_tickers || '' }}
          MAX_WORKERS: "3"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scanner/buffett_scanner.py

      - name: Actualizar panel visual automaticamente
        run: |
          mkdir -p /tmp/cocodrilo_out
          for f in data/latest-scan.json data/daily-scan.json; do
            if [ -f "$f" ]; then cp "$f" /tmp/cocodrilo_out/; fi
          done
          git fetch origin main
          git reset --hard origin/main
          mkdir -p data
          cp /tmp/cocodrilo_out/*.json data/
          git config user.name "Cocodrilo Bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Actualizacion diaria Radar Cocodrilo"
          git push

      - name: Avisar a Telegram si falla el bot
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=ERROR en Radar Cocodrilo (${{ github.workflow }}). Revisa el fallo aqui: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            
