name: Radar Cocodrilo Diario

on:
  schedule:
    - cron: '15 21 * * 1-5'
  workflow_dispatch:
    inputs:
      universe:
        description: 'Universo (rotacion_diaria, global_mega, custom)'
        required: false
        default: 'rotacion_diaria'
      test_mode:
        description: 'Enviar siempre resumen a Telegram (true/false)'
        required: false
        default: 'false'
      custom_tickers:
        description: 'Tickers o nombres (solo modo custom)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: cocodrilo-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install --upgrade yfinance pandas google-auth requests

      - name: Ejecutar tests del Oráculo (obligatorio)
        run: python -m unittest scanner/test_oracle_v10.py -v

      - name: Ejecutar escáner Cocodrilo
        env:
          UNIVERSE_MODE: ${{ github.event.inputs.universe || 'rotacion_diaria' }}
          TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
          CUSTOM_TICKERS: ${{ github.event.inputs.custom_tickers || '' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DEVICE_TOKEN: ${{ secrets.FIREBASE_DEVICE_TOKEN }}
        run: python scanner/buffett_scanner.py

      - name: Publicar JSON actualizados
        run: |
          mkdir -p /tmp/cocodrilo_out
          cp data/*.json /tmp/cocodrilo_out/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p data
          cp /tmp/cocodrilo_out/*.json data/ 2>/dev/null || true
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Update Radar Cocodrilo daily scan"
            git push
          else
            echo "Sin cambios en data/"
          fi
